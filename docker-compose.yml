services:
  db:
    image: postgres:18
    container_name: financial_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: financial_crm_web
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/financial_crm
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: